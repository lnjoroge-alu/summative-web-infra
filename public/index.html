<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nearby Essentials</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>Find Nearby Essentials</h1>
            <p>Find the nearest pharmacy, hospital, clinic, ATM, bank or supermarket.</p>
        </header>

        <main>
            <form id="search-form" novalidate>
                <label>Area
                    <input id="area" type="text" placeholder="Kigali, Nairobi" required>
                </label>

                <label> Looking for
                    <select id="category">
                            <option value="healthcare.pharmacy">Pharmacy</option>
                            <option value="healthcare.hospital">Hospital</option>
                            <option value="healthcare.clinic_or_praxis">Clinic</option>
                            <option value="service.financial.atm">ATM</option>
                            <option value="service.financial.bank">Bank</option>
                            <option value="commercial.supermarket">Supermarket</option>
                    </select>
                </label>

                <label>Radius (km)
                    <select id="radius">
                        <option value="500">0.5 km</option>
                        <option value="1000">1 km</option>
                        <option value="2000">2 km</option>
                        <option value="5000">5 km</option>
                    </select>
                </label>

                <button type="submit" id="search-btn">Search</button>
            </form>

            <div class="toolbar">
                <label>Sort by
                    <select id="sort">
                        <option value="distance">Nearest first</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </label>
                
                <label>Filter by name
                    <input id="filter" type="search">
                </label>

                <label class="checkbox">
                    <input id="phone-only" type="checkbox">
                    Only places with phone number
                </label>

            </div>


        </main>

          <footer>
            Powered by <a href="https://www.geoapify.com/">Geoapify</a> ·
            Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
